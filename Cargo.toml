[package]
name = "nddev-device-sync-server"
version = "0.0.1-alpha.14"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
build = "build.rs"

[dependencies]
prost = "0.14"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
nddev-device-sync-http-signatures = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-protocol.git", rev = "dbafb78c3ac133a31e465c9ac68215ee7cae3954" }
axum = "0.8.9"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
zeroize = "1.8"
webauthn-rs = { version = "=0.5.5", default-features = false }
libc = "0.2"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
nddev-device-sync-application = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-core.git", rev = "d08e6b34c9ff6af1fdc179291f5386ec73c84926" }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "form", "json"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2.0"
subtle = "2.6"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", default-features = false }
tracing = "0.1"
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-observability.git", rev = "469a77aea2e234b50d0554625a761d52985e7cb0", features = ["otlp", "client-traces"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
uuid = { version = "1.27", features = ["serde", "v4", "v5"] }
ed25519-dalek = { version = "=3.0.0", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
rcgen = "0.14"
tokio = { version = "1.53", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
